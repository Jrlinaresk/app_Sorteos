name: sorteos_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
    # Paquete de localizaciones del SDK de Flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1          # Gestión de estado reactivo con Riverpod
  go_router: ^15.1.1                # Navegación y enrutamiento declarativo
  http: ^1.3.0                      # Cliente HTTP para llamadas a APIs REST
  intl: ^0.20.2                    # Internacionalización y formateo de fechas/números
  permission_handler: ^12.0.0+1     # Solicitar y gestionar permisos en Android/iOS
  json_annotation: ^4.8.1         # Anotaciones para json_serializable: facilita convertir JSON ↔ Dart.
  flutter_slidable: ^4.0.0        # Sliders interactivos para listas (swipe to delete, actions…).
  shared_preferences: ^2.5.3      # Almacenamiento sencillo de pares clave–valor en el dispositivo.
  flutter_screenutil: ^5.9.3      # Adaptación de tamaños, márgenes y tipografía a distintas pantallas.
  mobile_number: ^3.0.0           # Obtener y validar el número de teléfono del dispositivo.
  cached_network_image: ^3.4.1    # Carga y cachea imágenes desde la red de forma eficiente.
  flutter_cache_manager: ^3.4.1   # Gestor de caché de archivos para usar junto a cached_network_image.
  flutter_svg: ^2.2.0             # Renderiza archivos SVG como widgets nativos de Flutter.
  stylish_bottom_bar: ^1.1.1      # Barra inferior de navegación con estilos y animaciones listos.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_colores.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/placeholder.png
    - assets/svg/zelle.svg
    - assets/svg/bankcup.svg
    - assets/svg/bankmlc.svg
    - assets/svg/etecsa.svg
    - assets/images/logo_white.png
    - assets/images/logo_colores.png
    - assets/uploads/
    - assets/svg/
